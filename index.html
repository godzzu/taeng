<!doctype html>
<html lang="ko" data-theme="wedding-floral">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#faf9f3">
  <meta name="description" content="2027년 5월 15일 토요일 오후 12시 30분">
  <!-- Generated from wedding.config.js by npm run build:meta before deployment. -->
  <meta property="og:type" content="website">
  <meta property="og:locale" content="ko_KR">
  <meta property="og:title" content="홍길동 ♥ 김하나 결혼합니다">
  <meta property="og:description" content="2027년 5월 15일 토요일 오후 12시 30분">
  <meta property="og:url" content="https://godzzu.github.io/wd_letter/">
  <meta property="og:image" content="https://godzzu.github.io/wd_letter/assets/images/og/wedding.png">
  <meta property="og:image:alt" content="결혼식 초대장">
  <title>홍길동 ♥ 김하나 결혼합니다</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Allura&family=Nanum+Pen+Script&family=Noto+Serif+KR:wght@400&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/reset.css">
  <link rel="stylesheet" href="./css/variables.css">
  <link rel="stylesheet" href="./css/common.css">
  <link rel="stylesheet" href="./css/layout.css">
  <link rel="stylesheet" href="./css/themes/floral.css">
  <link rel="stylesheet" href="./css/themes/sketch.css">
  <link rel="stylesheet" href="./css/themes/ticket.css">
  <link rel="stylesheet" href="./css/components/sections.css">
  <link rel="stylesheet" href="./css/components/buttons.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="#hero" data-aria="home" data-copy="brand"></a>
    <button class="music-toggle" type="button" data-music-toggle aria-label="배경음악 재생" aria-pressed="false" hidden>
      <svg class="music-icon-muted" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path d="M6 9H3v6h4l5 4v-6M9 7l3-2v3"/>
        <path d="M16 9c1.5 1.8 1.5 4.2 0 6M19 6c3 3.3 3 8.7 0 12M2 2l20 20"/>
      </svg>
      <svg class="music-icon-sounding" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path class="music-speaker" d="M3 9h4l5-4v14l-5-4H3Z"/>
        <path d="M16 9c1.5 1.8 1.5 4.2 0 6M19 6c3 3.3 3 8.7 0 12"/>
      </svg>
    </button>
  </header>

  <main id="main-content">
    <section id="hero" class="section hero" aria-labelledby="hero-title">
      <div class="section-inner" data-section-content>
        <p class="eyebrow"></p>
        <h1 id="hero-title"></h1>
        <div class="hero-media" data-hero-media hidden>
          <img class="hero-image" data-field="hero-image" alt="" hidden fetchpriority="high" decoding="async">
          <div class="hero-sparkles" aria-hidden="true">
            <span></span><span></span><span></span><span></span><span></span><span></span>
          </div>
        </div>
        <p class="hero-names" data-field="names"></p>
        <div class="hero-summary">
          <p data-field="venue"></p>
          <time class="hero-date" data-field="date"></time>
        </div>
        <a class="text-link hero-scroll" href="#invitation">
          <span data-field="scroll-label"></span>
          <svg class="hero-scroll-icon" viewBox="0 0 24 24" width="24" height="24" fill="none" aria-hidden="true" focusable="false">
            <path d="M12 4v15m-6-6 6 6 6-6" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </a>
      </div>
    </section>

    <section id="invitation" class="section" aria-labelledby="invitation-title" tabindex="-1">
      <div class="section-inner">
        <p class="eyebrow"></p>
        <h2 id="invitation-title"></h2>
        <p class="invitation-message" data-field="message"></p>
        <ul class="family-grid" data-field="families" role="list"></ul>
      </div>
    </section>

    <section id="wedding-info" class="section section-soft" aria-labelledby="wedding-info-title">
      <div class="section-inner">
        <p class="eyebrow"></p>
        <h2 id="wedding-info-title"></h2>
        <time class="date-large" data-field="date"></time>
        <time class="wedding-time" data-field="time"></time>
        <div class="info-card">
          <div class="wedding-calendar" data-field="calendar"></div>
          <p class="dday" data-field="dday" role="status" aria-live="polite" aria-atomic="true"></p>
        </div>
      </div>
    </section>

    <section id="location" class="section section-soft" aria-labelledby="location-title">
      <div class="section-inner">
        <p class="eyebrow"></p>
        <h2 id="location-title"></h2>
        <div class="info-card">
          <h3 data-field="location-venue"></h3>
          <p data-field="location-address"></p>
          <button class="button button-small" type="button" data-copy-address></button>
          <p class="location-copy-status" data-address-status role="status" aria-live="polite"></p>
          <div class="location-map-frame">
            <div class="location-map" data-location-map hidden></div>
            <p class="location-map-status" data-map-status role="status" aria-live="polite"></p>
          </div>
          <div class="button-row map-links" data-field="map-links"></div>
        </div>
          <div class="travel-guide" id="location-travel">
            <div class="travel-item" data-travel="car">
              <span class="travel-icon" aria-hidden="true"><svg viewBox="0 0 32 32" fill="none" focusable="false"><path d="m7 13 2-7h14l2 7M6 13h20v11H6zM9 24v3m14-3v3M9 18h3m8 0h3M4 13h3m18 0h3"/></svg></span>
              <div class="travel-copy"><h3></h3><p></p></div>
            </div>
            <div class="travel-item" data-travel="transport">
              <span class="travel-icon" aria-hidden="true"><svg viewBox="0 0 32 32" fill="none" focusable="false"><rect x="7" y="4" width="18" height="22" rx="4"/><path d="M7 10h18M7 19h18M11 7h10M11 23h1m8 0h1M10 26v2m12-2v2M4 11v6m24-6v6"/></svg></span>
              <div class="travel-copy"><h3></h3><p></p></div>
            </div>
            <div class="travel-item" data-travel="subway">
              <span class="travel-icon" aria-hidden="true"><svg viewBox="0 0 32 32" fill="none" focusable="false"><rect x="8" y="4" width="16" height="21" rx="6"/><path d="M9 10h14v9H9M12 22h1m6 0h1M12 25l-4 4m12-4 4 4M10 28h12M13 7h6"/></svg></span>
              <div class="travel-copy"><h3></h3><p></p></div>
            </div>
            <div class="travel-item" data-travel="parking">
              <span class="travel-icon" aria-hidden="true"><svg viewBox="0 0 32 32" fill="none" focusable="false"><rect x="5" y="5" width="22" height="22" rx="5"/><path d="M12 24V10h6a5 5 0 0 1 0 10h-6"/></svg></span>
              <div class="travel-copy"><h3></h3><p></p></div>
            </div>
          </div>
      </div>
    </section>

    <section id="gallery" class="section" aria-labelledby="gallery-title">
      <div class="section-inner">
        <p class="eyebrow"></p>
        <h2 id="gallery-title"></h2>
        <div class="gallery-grid" data-field="gallery"></div>
      </div>
    </section>

    <section id="account" class="section" aria-labelledby="account-title">
      <div class="section-inner">
        <p class="eyebrow"></p>
        <h2 id="account-title"></h2>
        <p class="section-description"></p>
        <div class="account-list" data-field="accounts"></div>
      </div>
    </section>

    <section id="contact" class="section section-soft" aria-labelledby="contact-title">
      <div class="section-inner">
        <p class="eyebrow"></p>
        <h2 id="contact-title"></h2>
        <div class="contact-list" data-field="contacts"></div>
      </div>
    </section>

    <section id="guestbook" class="section" aria-labelledby="guestbook-title">
      <div class="section-inner">
        <p class="eyebrow"></p>
        <h2 id="guestbook-title"></h2>
        <p class="section-description"></p>
        <form class="guestbook-form" data-guestbook-form>
          <label for="guest-name" data-copy="guestName"></label>
          <input id="guest-name" name="name" maxlength="30" required autocomplete="name" aria-describedby="guest-name-count" data-placeholder="guestNamePlaceholder">
          <p id="guest-name-count" class="guestbook-count" data-name-count></p>
          <label for="guest-message" data-copy="guestMessage"></label>
          <textarea id="guest-message" name="message" maxlength="300" required rows="5" aria-describedby="guest-message-count" data-placeholder="guestMessagePlaceholder"></textarea>
          <p id="guest-message-count" class="guestbook-count" data-message-count></p>
          <div hidden aria-hidden="true"><input name="website" tabindex="-1" autocomplete="off" aria-label="Website"></div>
          <button class="button button-primary" type="submit" data-copy="guestSubmit"></button>
          <p class="form-status" role="status" aria-live="polite" data-field="guestbook-status"></p>
        </form>
        <div class="guestbook-list" data-field="guestbook-list"></div>
        <p class="form-status" data-guestbook-list-status role="status" aria-live="polite"></p>
        <button class="button" type="button" data-guestbook-more hidden></button>
      </div>
    </section>
  </main>

  <div class="toast" role="status" aria-live="polite" data-toast></div>
  <dialog class="image-dialog" data-gallery-dialog data-aria="galleryDialog">
    <button class="dialog-close" type="button" data-dialog-close data-aria="galleryClose" autofocus>×</button>
    <button class="dialog-nav dialog-prev" type="button" data-dialog-prev data-aria="galleryPrev">‹</button>
    <div class="dialog-stage" data-dialog-stage>
      <img alt="" data-dialog-image hidden>
      <div class="dialog-feedback">
        <p data-dialog-status role="status" aria-live="polite"></p>
        <button class="button button-small" type="button" data-dialog-retry hidden></button>
      </div>
    </div>
    <button class="dialog-nav dialog-next" type="button" data-dialog-next data-aria="galleryNext">›</button>
    <p class="dialog-counter" data-dialog-counter role="status" aria-live="polite" aria-atomic="true"></p>
  </dialog>

  <script type="module" src="./js/main.js"></script>
</body>
</html>
